[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diswhisper"
version = "0.2.1"
description = "Local Discord voice transcription and AI meeting notes with native Windows and macOS apps"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "0BSD" }
keywords = [
    "discord", "discord-bot", "transcription", "speech-to-text", "speech-recognition",
    "whisper", "faster-whisper", "sensevoice", "vosk", "local-ai", "meeting-notes",
    "windows", "macos",
]
authors = [
    { name = "DisWhisper Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "discord.py[voice]>=2.7.1",
    "discord-ext-voice-recv==0.5.2a179",
    "davey>=0.1.3",
    "faster-whisper>=1.1.0",
    "av>=11,<17",
    "ctranslate2>=4.0.0",
    "sherpa-onnx>=1.13.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.9.0",
    "huggingface-hub>=1.33.0,<2",
    "vosk>=0.3.45; sys_platform != 'darwin'",
    "vosk==0.3.44; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "anyio>=4.0.0",
    "ruff>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/MaxJafar/DisWhisper"
Source = "https://github.com/MaxJafar/DisWhisper"
Issues = "https://github.com/MaxJafar/DisWhisper/issues"
Releases = "https://github.com/MaxJafar/DisWhisper/releases"
Documentation = "https://github.com/MaxJafar/DisWhisper#readme"

[project.scripts]
diswhisper = "diswhisper.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["diswhisper*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
