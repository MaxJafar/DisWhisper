name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - if: runner.os != 'macOS'
        run: python -m pip install -e ".[dev]"
      - if: runner.os == 'macOS'
        run: |
          python -m pip install -r requirements-macos.lock
          python -m pip install --no-deps -e .
      - run: python -m pytest tests/ -v
      - run: python -m ruff check diswhisper tests scripts
      - if: runner.os == 'macOS'
        run: |
          swift test --package-path companion/macos/DisWhisperCompanion
          xcodebuild -quiet -project companion/macos/DisWhisperCompanion/DisWhisperCompanion.xcodeproj -scheme DisWhisperCompanion -configuration Release CODE_SIGNING_ALLOWED=NO build
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build companion/windows/DisWhisper.Companion/DisWhisper.Companion.csproj -c Release -p:Platform=x64 --nologo
