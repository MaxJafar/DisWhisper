name: macOS portable build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: |
          test "$(uname -m)" = "$RELEASE_ARCH"
          ./scripts/build_macos.sh
          release_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          ./scripts/smoke_macos_installer.sh "dist/DisWhisper-$release_version-macos-$RELEASE_ARCH.dmg"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: DisWhisper-macos-${{ matrix.arch }}
          path: |
            dist/DisWhisper-*-macos-*.dmg
            dist/DisWhisper-*-macos-*.zip
            dist/DisWhisper-*-macos-*.sha256
          if-no-files-found: error
